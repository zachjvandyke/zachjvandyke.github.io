<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Audio + Buy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <section class="card" aria-label="Player">
      <div class="art" role="img" aria-label="Cover art">
        <img id="cover" src="assets/cover.jpg" alt="Cover art" />
      </div>

      <div class="controls">
        <audio id="audio" preload="metadata" src="assets/audio.mp3"></audio>

        <div class="row">
          <button id="playBtn" class="btn" type="button" aria-label="Play/Pause">▶︎</button>

          <div class="time">
            <span id="cur">0:00</span>
            <input id="seek" class="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek" />
            <span id="dur">0:00</span>
          </div>
        </div>

        <div class="row small">
          <button id="back15" class="btn ghost" type="button">-15s</button>
          <button id="fwd30" class="btn ghost" type="button">+30s</button>

          <div class="spacer"></div>
        </div>

        <a class="buy" href="https://example.com" target="_blank" rel="noopener noreferrer">Buy now</a>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
