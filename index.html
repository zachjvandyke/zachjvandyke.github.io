
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ESV Symphony of Scripture Audio Bible, Gospel of John, Narrated by Jubilant Sykes — Audiobook</title>
    <meta name="description" content="Where to listen to the ESV Symphony of Scripture Audio Bible, Gospel of John, Narrated by Jubilant Sykes audiobook.">
    <meta name="robots" content="noindex">
    <style>
        :root {
        color-scheme: dark;
        --ground: #0a0a0a;
        --ink: #d5d4cf; /* titles — 13.3:1 on the ground */
        --ink-soft: #afaeaa; /* pill labels, body — 8.9:1 */
        /* The reference's dimmest grey is #757471, which lands at 4.24:1 and
        just misses WCAG AA for normal text. Six points lighter clears it at
        4.6:1 and is indistinguishable at these sizes — this page gets read
        once, on a phone, possibly in daylight. */
        --ink-muted: #7b7a77; /* micro-labels, subtitle, pill borders */
        --hairline: rgba(213, 212, 207, 0.09);
        }
        * { box-sizing: border-box; }
        /* Adobe Text Pro is the reference's serif and Gotham its sans; both are
        named first so a machine that has them uses them, and both fall back to
        something close rather than loading a webfont. A page reached by tapping
        a tag gets one chance on a cold connection — no font round trip. */
        :root {
        --serif: "Adobe Text Pro", Georgia, "Times New Roman", serif;
        --sans: Gotham, "Gotham A", "Gotham B", "Helvetica Neue", Helvetica,
        Arial, sans-serif;
        }
        body {
        margin: 0;
        padding: 3rem 1.5rem 3.5rem;
        background: var(--ground);
        color: var(--ink-soft);
        font-family: var(--serif);
        -webkit-text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
        }
        .sheet { max-width: 25rem; margin: 0 auto; }
        /* Natural aspect, not a forced square: an audiobook cover is square and a
        jacket is tall, and cropping either to fit the other would be an edit. */
        .cover {
        display: block;
        width: 100%;
        max-width: 19rem;
        height: auto;
        margin: 0 auto 2.25rem;
        border: 1px solid var(--hairline);
        }
        h1 {
        margin: 0 0 0.5rem;
        font-family: var(--serif);
        font-size: 1.6rem;
        font-style: italic;
        font-weight: 400;
        line-height: 1.25;
        text-align: center;
        text-wrap: balance;
        color: var(--ink);
        }
        /* Roman against the italic title, so the two do not compete. */
        .subtitle {
        margin: 0 0 1.5rem;
        font-size: 1rem;
        font-style: normal;
        line-height: 1.45;
        text-align: center;
        text-wrap: balance;
        color: var(--ink-muted);
        }
        .credits {
        margin: 0 0 2.75rem;
        font-family: var(--sans);
        font-size: 0.7rem;
        letter-spacing: 0.2em;
        line-height: 2;
        text-align: center;
        text-transform: uppercase;
        color: var(--ink-muted);
        }
        .listen-at {
        margin: 0 0 1.5rem;
        font-family: var(--sans);
        font-size: 0.68rem;
        font-weight: 400;
        letter-spacing: 0.34em;
        text-align: center;
        text-transform: uppercase;
        color: var(--ink-muted);
        }
        .links {
        display: grid;
        gap: 0.85rem;
        margin: 0;
        padding: 0;
        list-style: none;
        }
        /* The reference's button: no fill, hairline border, full pill radius,
        italic serif. 3.5rem clears the 44px minimum tap target with room —
        this gets used one-handed, seconds after a phone touched a tag. */
        .links a {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 3.5rem;
        padding: 0.9rem 1.75rem;
        border: 1px solid var(--ink-muted);
        border-radius: 999px;
        background: none;
        color: var(--ink-soft);
        font-family: var(--serif);
        font-size: 1.06rem;
        font-style: italic;
        text-align: center;
        text-decoration: none;
        transition: border-color 0.25s ease, color 0.25s ease;
        }
        .links a:hover,
        .links a:focus-visible {
        border-color: var(--ink);
        color: var(--ink);
        }
        .empty {
        margin: 0;
        font-size: 1rem;
        font-style: italic;
        line-height: 1.5;
        text-align: center;
        color: var(--ink-muted);
        }
        footer {
        margin: 3.25rem 0 0;
        font-family: var(--sans);
        font-size: 0.65rem;
        letter-spacing: 0.28em;
        text-align: center;
        text-transform: uppercase;
        color: var(--ink-muted);
        }
        /* The wordmark carries its own colours, so it is placed rather than
        recoloured or dimmed. It is small and last on the page, which is enough
        to keep it from competing with the links. */
        footer img {
        display: block;
        width: 8.75rem;
        max-width: 60%;
        height: auto;
        margin: 0 auto;
        }
    </style>
</head>
